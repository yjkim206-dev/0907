<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>로그인 | 모퉁이 기록</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">모퉁이 <span>기록</span></a>
      <button class="menu-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <nav class="site-nav">
        <a href="index.html">홈</a>
        <a href="posts.html">글 목록</a>
        <a href="signup.html">회원가입</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <p class="eyebrow">WELCOME BACK</p>
      <h1>다시 만나서 반가워요.</h1>
      <p>로그인하고 나만의 생각을 기록해 보세요.</p>

      <form>
        <label class="field">이메일 주소
          <input name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </label>
        <label class="field">비밀번호
          <input name="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password" required>
        </label>
        <button type="submit" class="button full">로그인</button>
        <p class="form-message form-note" role="status"></p>
      </form>

      <p class="form-note">아직 계정이 없으신가요? <a class="text-link" href="signup.html">회원가입</a></p>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
