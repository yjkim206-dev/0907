<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>회원가입 | 모퉁이 기록</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">모퉁이 <span>기록</span></a>
      <button class="menu-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <nav class="site-nav">
        <a href="index.html">홈</a>
        <a href="posts.html">글 목록</a>
        <a href="login.html">로그인</a>
      </nav>
    </div>
  </header>

  <main class="auth-wrap">
    <section class="auth-card">
      <p class="eyebrow">JOIN CORNER LOG</p>
      <h1>나만의 기록을 시작하세요.</h1>
      <p>읽은 글을 저장하고, 직접 쓴 이야기를 발행할 수 있습니다.</p>

      <form>
        <label class="field">이름
          <input name="name" type="text" placeholder="이름 또는 닉네임" autocomplete="name" required>
        </label>
        <label class="field">이메일 주소
          <input name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </label>
        <label class="field">비밀번호
          <input name="password" type="password" placeholder="8자 이상 입력" minlength="8" autocomplete="new-password" required>
        </label>
        <button type="submit" class="button full">회원가입</button>
        <p class="form-message form-note" role="status"></p>
      </form>

      <p class="form-note">이미 계정이 있으신가요? <a class="text-link" href="login.html">로그인</a></p>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
