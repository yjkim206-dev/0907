<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>게시글 목록 | 모퉁이 기록</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/editor-fix.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">모퉁이 <span>기록</span></a>
      <button class="menu-toggle" aria-label="메뉴 열기" aria-expanded="false">☰</button>
      <nav class="site-nav">
        <a href="index.html">홈</a>
        <a class="active" href="posts.html">게시글</a>
        <a href="login.html">로그인</a>
        <a class="nav-action" href="write.html">글쓰기</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="container">
        <p class="eyebrow">ALL POSTS</p>
        <h1>모든 기록</h1>
        <p>등록된 게시글을 검색하거나 카테고리별로 찾아보세요.</p>
      </div>
    </section>

    <div class="container archive-tools">
      <input id="post-search" type="search" placeholder="게시글 검색" aria-label="게시글 검색">
      <select id="category-filter" aria-label="카테고리 필터">
        <option value="">전체 카테고리</option>
      </select>
      <input id="post-page" type="hidden" value="1">
    </div>

    <div class="container content-layout">
      <section class="post-list" id="post-list" aria-label="게시글 목록"></section>
      <aside class="sidebar">
        <h3>카테고리</h3>
        <div id="category-links"></div>
      </aside>
    </div>
    <div class="container"><div id="pagination" class="pagination" aria-label="게시글 페이지"></div></div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 모퉁이 기록</div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
