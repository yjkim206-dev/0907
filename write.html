<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>글쓰기 | 모퉁이 기록</title><link rel="stylesheet" href="css/style.css"></head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">모퉁이 <span>기록</span></a><button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">☰</button><nav class="site-nav"><a href="index.html">홈</a><a href="posts.html">게시글</a><a href="login.html">로그인</a><a class="nav-action" href="write.html">글쓰기</a></nav></div></header>
  <main class="writer-page">
    <section class="form-card writer-card"><p class="eyebrow" data-editor-kicker>NEW POST</p><h1 data-editor-title>새 글 작성</h1><p class="writer-intro">작성 중인 내용은 미리보기에서 바로 확인할 수 있습니다.</p>
      <form data-editor-form>
        <label class="field">카테고리<select name="category" required><option value="" selected disabled>카테고리를 선택하세요</option><option value="일상">일상</option><option value="자유">자유</option><option value="디자인">디자인</option><option value="사회">사회</option><option value="경제">경제</option><option value="문화">문화</option><option value="기술">기술</option><option value="여행">여행</option><option value="요리">요리</option><option value="배움">배움</option></select></label>
        <label class="field">제목<input name="title" type="text" required maxlength="120" placeholder="제목을 입력하세요"></label>
        <label class="field">내용<textarea name="content" rows="14" required placeholder="내용을 입력하세요"></textarea></label>
        <div class="form-actions"><button class="button secondary-btn" type="button" data-preview-toggle>미리보기</button><button class="button" type="submit" data-submit-label>발행하기</button></div>
        <p class="form-message form-note" role="status"></p>
      </form>
    </section>
    <section class="post-preview" data-post-preview hidden aria-live="polite"><p class="eyebrow">PREVIEW</p><p class="post-preview-meta"></p><h2 class="post-preview-title">제목 미리보기</h2><div class="post-preview-content">내용 미리보기</div></section>
  </main>
  <script src="js/main.js"></script><script src="js/editor.js"></script>
</body>
</html>
